[project]
name = "deep-research-agent"
version = "0.1.0"
description = "Multi-agent deep research pipeline with hybrid RAG, citations, and evals."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0.6",
    "langchain-core>=0.3",
    "langchain-groq>=0.2",
    "groq>=0.11",
    "google-genai>=1.0",
    "qdrant-client[fastembed]>=1.12",
    "langfuse>=3.0",
    "ragas>=0.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.0",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "ddgs>=9.0",
    "tiktoken>=0.8",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_research"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
